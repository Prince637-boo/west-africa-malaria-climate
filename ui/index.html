<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Résultats modèles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="h3 mb-4">Résultats de l’évaluation</h1>
    <div id="error" class="alert alert-danger d-none"></div>
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr>
              <th>Modèle</th>
              <th>RMSE</th>
              <th>MAE</th>
              <th>R²</th>
              <th>MAE_Diff (vs persistence)</th>
              <th>IC 95 %</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="6" class="text-muted">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    function fmt(x, d = 4) {
      if (x == null || Number.isNaN(x)) return "—";
      return Number(x).toFixed(d);
    }

    fetch("./model_training_metrics.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("Fichier JSON introuvable");
        return r.json();
      })
      .then((data) => {
        const rows = Object.entries(data)
          .map(([name, m]) => ({ name, ...m }))
          .sort((a, b) => (a.rmse ?? 99) - (b.rmse ?? 99));

        document.getElementById("tbody").innerHTML = rows
          .map(
            (m) => `<tr>
              <td><strong>${m.name}</strong></td>
              <td>${fmt(m.rmse)}</td>
              <td>${fmt(m.mae)}</td>
              <td>${fmt(m.r2)}</td>
              <td>${m.mae_diff_vs_pers == null ? "référence" : fmt(m.mae_diff_vs_pers, 5)}</td>
              <td>${m.mae_diff_ci_95 ?? "—"}</td>
            </tr>`
          )
          .join("");
      })
      .catch((err) => {
        document.getElementById("error").classList.remove("d-none");
        document.getElementById("error").textContent =
          "Lance: .\\.venv314\\Scripts\\python.exe ui\\serve.py — " + err.message;
      });
  </script>
</body>
</html>
