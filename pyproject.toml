[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "west-africa-malaria-climate"
version = "0.2.0"
description = "Methodological pipeline for horizon-aware malaria incidence forecasting on simulated district panels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
